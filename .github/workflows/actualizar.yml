name: Actualizar catálogo INGALITO

on:
  schedule:
    # 09:00 Argentina (UTC-3). Argentina does not observe DST.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Instalar Chromium para el respaldo
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar scraping y actualización
        run: python -m scripts.actualizar_catalogo

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/catalogo.json data/koi_raw.json data/historial.json; then
            echo "No hay cambios en el catálogo."
          else
            git add data/catalogo.json data/koi_raw.json data/historial.json
            git commit -m "Actualizar catálogo INGALITO"
            git push
          fi